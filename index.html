<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PaperTalkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDE8; --page:#F8F9F6; --ink:#1E2830; --muted:#5A676E; --line:#D2D9D2;
  --now:#F5D67E; --now-ink:#1E2830; --mark:#DCD0F3; --accent:#2B6A65; --accent-ink:#FFFFFF;
  --panel:#F2F4F0; --you:#DDE7E5; --live:#C2413A;
  --h1:#DCD0F3; --h2:#CDE8C9; --h3:#C9DDF2; --h4:#F4CCD8;
  --ui:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read:"Literata", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141A1E; --page:#1A2126; --ink:#E3E8E3; --muted:#9AA6AA; --line:#2C373D;
    --now:#6E5C1C; --now-ink:#FFF5D6; --mark:#43395F; --accent:#72BCB3; --accent-ink:#0E1A19;
    --panel:#182025; --you:#22322F;
    --h1:#43395F; --h2:#2F4A31; --h3:#26405A; --h4:#5A2E3B;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--ui);overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;border-bottom:1px solid var(--line)}
header h1{font:600 1.05rem/1.3 var(--read);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#where{color:var(--muted);font-size:.9rem;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--page);border-radius:999px;padding:.4rem .85rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.main{flex:1;min-height:0;display:flex}
#reader{flex:1;min-width:0;overflow:auto;padding:2rem 1.25rem 4rem;background:var(--page)}
.text{max-width:38rem;margin:0 auto;font:400 1.2rem/1.8 var(--read)}
.text p{margin:0 0 1.1em}
.text p.aside{font:400 .8em/1.6 var(--ui);color:var(--muted);border-left:3px solid var(--line);padding-left:.7em}
.text p.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.75em}
.pg{font:700 .8rem/1 var(--ui);color:var(--muted);margin:2.2rem 0 1rem;display:flex;align-items:center;gap:.6rem}
.pg::after{content:"";flex:1;border-top:1px solid var(--line)}
.s{border-radius:3px;cursor:pointer;transition:background-color .25s}
.s:hover{background:color-mix(in srgb,var(--now) 30%,transparent)}
mark.hl{color:inherit;border-radius:2px;cursor:pointer;padding:.08em 0}
mark.hl.c1{background:var(--h1)} mark.hl.c2{background:var(--h2)} mark.hl.c3{background:var(--h3)} mark.hl.c4{background:var(--h4)}
mark.hl.noted{box-shadow:inset 0 -2px 0 var(--accent)}
mark.hl.flash{outline:2px solid var(--accent);outline-offset:1px}
.doc{display:flex;justify-content:center;gap:2rem;align-items:flex-start}
.doc .text{flex:0 1 38rem;min-width:0;margin:0}
#margin{flex:0 0 14rem;position:relative;align-self:stretch}
.mnote{position:absolute;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:.45rem .6rem;font-size:.9rem;line-height:1.4;cursor:pointer;white-space:pre-wrap;transition:top .15s}
.mnote:hover{border-color:var(--accent);border-left-color:var(--c)}
.mnote textarea,.note textarea{width:100%;min-height:4.5rem;border:1px solid var(--line);border-radius:8px;padding:.4rem;background:var(--page);font:inherit;resize:vertical}
.mnote .row,.note .row{display:flex;gap:.7rem;margin-top:.35rem;flex-wrap:wrap}
.mnote .row button,.note .row button{background:none;border:0;padding:0;color:var(--accent);font-size:.85rem}
#pages{flex:0 1 54rem;min-width:0;display:flex;flex-direction:column;gap:1.2rem;user-select:none;-webkit-user-select:none}
.pgwrap{position:relative;width:100%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);cursor:text}
.pgwrap img{display:block;width:100%;height:100%;pointer-events:none}
.ov{position:absolute;inset:0;pointer-events:none}
.box{position:absolute;border-radius:2px}
.box.now{background:rgba(245,196,60,.35);box-shadow:0 0 0 2px rgba(214,160,20,.75)}
.box.hlb{mix-blend-mode:multiply}
.box.hlb.c1{background:#CDB8F5} .box.hlb.c2{background:#B3E2AB} .box.hlb.c3{background:#AECCF3} .box.hlb.c4{background:#F5B3C7}
.box.hlb.noted{box-shadow:inset 0 -2px 0 var(--accent)}
.box.hlb.flash{outline:2px solid var(--accent);outline-offset:1px}
.box.selb{background:rgba(43,106,101,.22)}
@media (max-width:1180px){ #margin{display:none} mark.hl.noted::after{content:"✎";font-size:.7em;margin-left:.15em;color:var(--accent)} }
.s.now{background:var(--now);color:var(--now-ink);box-shadow:0 0 0 3px var(--now)}
.s.sel{outline:2px solid var(--accent);outline-offset:3px}
#tools{position:fixed;z-index:20;display:none;gap:.25rem;background:var(--ink);color:var(--page);padding:.3rem;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#tools.on{display:flex}
#tools{align-items:center}
#tools button{background:none;border:0;color:inherit;padding:.45rem .7rem;border-radius:8px;font-size:.92rem}
#tools .sw{width:1.7rem;height:1.7rem;padding:0;border-radius:50%;border:2px solid transparent;margin:0 .1rem}
#tools .sw.on{border-color:var(--page)}
#tools .sep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:.2rem .2rem}
#tools button:hover{background:rgba(255,255,255,.15)}
.empty{max-width:34rem;margin:7vh auto 0}
.empty h2{font:600 2rem/1.2 var(--read);margin:0 0 .6rem}
.empty p{color:var(--muted);margin:0 0 1.4rem;font-size:1.05rem}
.drop{border:2px dashed var(--line);border-radius:16px;padding:1.6rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.drop.over{border-color:var(--accent)}
#status{color:var(--muted);margin-top:1rem;min-height:1.5em}
.warn{background:color-mix(in srgb,var(--live) 12%,transparent);border-radius:12px;padding:.7rem .9rem;margin-top:1rem}
.recent{margin-top:1.8rem}
.recent h3{font-size:.95rem;margin:0 0 .5rem;color:var(--muted)}
.recent .item{display:flex;align-items:center;gap:1rem;border-top:1px solid var(--line)}
.recent .open{flex:1;display:flex;justify-content:space-between;gap:1rem;text-align:left;background:none;border:0;padding:.65rem 0;font-family:var(--read);min-width:0}
.recent .open span:last-child{font-family:var(--ui);color:var(--muted);font-size:.9rem;white-space:nowrap}
.recent .del{background:none;border:0;color:var(--muted);font-size:.85rem;padding:.3rem .5rem;border-radius:8px}
.recent .del:hover{color:var(--live);background:color-mix(in srgb,var(--live) 10%,transparent)}
.home aside,.home .player{display:none}
aside{width:25rem;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:.7rem;border-bottom:3px solid transparent;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.pane{flex:1;min-height:0;overflow:auto;padding:1rem}
.pane[hidden]{display:none}
.msg{margin:0 0 .9rem;padding:.65rem .8rem;border-radius:12px;max-width:92%;white-space:pre-wrap;line-height:1.5}
.msg.user{background:var(--you);margin-left:auto}
.msg.assistant{background:var(--page);border:1px solid var(--line)}
.msg.focus{background:color-mix(in srgb,var(--accent) 9%,var(--page));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-left:4px solid var(--accent);max-width:100%;cursor:pointer}
.msg.focus .lbl{display:block;font-size:.78rem;font-weight:700;color:var(--accent);margin-bottom:.2rem}
.msg.focus .body{font:italic .95rem/1.5 var(--read)}
.msg .status{font-size:.8rem;color:var(--muted);margin-bottom:.3rem}
.msg.sys{background:none;color:var(--muted);font-size:.88rem;padding:0 .2rem;max-width:100%;text-align:center}
.msg .anchor{display:block;background:none;border:0;padding:0;margin:0 0 .3rem;font-size:.8rem;color:var(--muted);text-align:left;font-style:italic}
.hint{color:var(--muted);font-size:.95rem}
.convhead{display:flex;align-items:center;gap:.6rem;padding:.5rem 1rem;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.convhead span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.convhead button{background:none;border:0;color:var(--accent);font-size:.85rem;padding:0;white-space:nowrap}
#live{min-height:1.5em;color:var(--muted);font-style:italic;padding:0 .2rem .4rem}
.compose{border-top:1px solid var(--line);padding:.6rem;display:flex;gap:.4rem;align-items:flex-end}
.compose textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:.5rem .7rem;background:var(--page);max-height:8rem}
.icon{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:var(--page);display:grid;place-items:center;flex:0 0 auto;padding:0}
.icon svg{width:1.2rem;height:1.2rem}
.note{border-top:1px solid var(--line);padding:.7rem 0}
.note q{display:block;font:italic .92rem/1.45 var(--read);color:var(--muted);cursor:pointer;quotes:none}
.note .body{margin:.35rem 0 0;white-space:pre-wrap}
.note{border-left:4px solid var(--c);padding-left:.6rem}
.player{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.8rem 2rem;padding:.65rem 1.6rem;border-top:1px solid var(--line)}
.grp{display:flex;align-items:center;gap:.6rem}
.play{width:3.2rem;height:3.2rem;border-radius:50%;border:0;background:var(--ink);color:var(--page);display:grid;place-items:center}
.play svg{width:1.4rem;height:1.4rem}
.opts{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem 1.2rem;min-width:0}
.opts .line{display:contents}
.opts label{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.opts select{border:1px solid var(--line);border-radius:8px;background:var(--page);padding:.3rem .45rem}
.opts input[type=checkbox]{accent-color:var(--accent);margin:0}
/* Skip: quiet toggles that read like words; pick any number of them, or none */
.skip{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .2rem;font-size:.85rem;border-left:1px solid var(--line);padding-left:1.1rem}
.skip .lbl{color:var(--muted);margin-right:.25rem}
.chip{background:none;border:0;border-radius:999px;padding:.2rem .55rem;color:var(--muted);transition:background-color .15s,color .15s}
.chip::before{content:"✓";display:inline-block;width:0;overflow:hidden;opacity:0;font:700 .8em/1 system-ui,sans-serif;vertical-align:.05em;transition:width .15s,opacity .15s}
.chip:hover{color:var(--ink);background:color-mix(in srgb,var(--line) 45%,transparent)}
.chip[aria-pressed="true"]{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip[aria-pressed="true"]::before{width:1.05em;opacity:1}
.call{display:flex;align-items:center;justify-content:flex-end;gap:1rem}
.call .barge{font-size:.85rem;color:var(--muted);display:flex;align-items:center;gap:.45rem;white-space:nowrap}
.call .barge input{accent-color:var(--accent);margin:0}
#callState{font-weight:700;display:flex;align-items:center;gap:.45rem;color:var(--muted)}
#callState .dot{width:.7rem;height:.7rem;border-radius:50%;background:currentColor}
#callState.listening{color:var(--live)} #callState.listening .dot{animation:pulse 1.2s infinite}
#callState.thinking{color:var(--muted)} #callState.thinking .dot{animation:blink 1s infinite}
#callState.speaking{color:var(--accent)}
@keyframes pulse{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--live) 25%,transparent)}}
@keyframes blink{50%{opacity:.25}}
.talk{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:.85rem 1.5rem;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:.55rem}
.talk svg{width:1.2rem;height:1.2rem}
.talk.end{background:var(--live);color:#fff}
.keys{font-size:.8rem;color:var(--muted)}
@media (max-width:900px){ aside{width:20rem} .keys{display:none} }
@media (max-width:820px){ .player{grid-template-columns:auto 1fr} .call{grid-column:1 / -1} }
@media (max-width:1750px){ .keys{display:none} }
@media (max-width:1500px){ .player{gap:.8rem 1.3rem} .opts{gap:.5rem .9rem} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hidden{display:none!important}
</style>
</head>
<body class="home">
<div class="app">
  <header>
    <h1 id="title">PaperTalkthrough</h1>
    <span id="where"></span>
    <button class="btn hidden" id="viewBtn">Page view</button>
    <button class="btn hidden" id="exportBtn">Export PDF</button>
    <button class="btn hidden" id="home">Library</button>
  </header>
  <div class="main">
    <div id="reader">
      <div class="empty" id="empty">
        <h2>Listen to a paper. Call in whenever you have a question.</h2>
        <p>Open a PDF and it's read aloud sentence by sentence. Press <b>Call</b> to talk it over, and when you hang up, reading picks up exactly where it stopped.</p>
        <div class="drop" id="drop">
          <button class="btn primary" id="pick">Open a PDF</button>
          <span class="hint">or drop one here</span>
        </div>
        <div id="status"></div>
        <div id="warnings"></div>
        <div class="recent hidden" id="recent"><h3>Your library</h3><div id="recentList"></div></div>
      </div>
      <div class="doc"><div class="text" id="text"></div><div id="pages" class="hidden"></div><div id="margin" aria-label="Notes in the margin"></div></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="call">Call</button>
        <button role="tab" aria-selected="false" data-tab="notes">Notes</button>
      </div>
      <div class="convhead"><span id="convTitle"></span><button id="clearChat">Clear conversation</button></div>
      <div class="pane" id="callPane"><div id="msgs"></div><div id="live"></div></div>
      <div class="pane" id="notesPane" hidden><div id="noteList"></div></div>
      <div class="compose" id="compose">
        <textarea id="input" rows="1" placeholder="Or type a question…"></textarea>
        <button class="icon" id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h15M13 6l6 6-6 6"/></svg></button>
      </div>
    </aside>
  </div>
  <div class="player">
    <div class="grp">
      <button class="icon" id="prev" aria-label="Previous sentence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 9 12l9 6zM6 6v12"/></svg></button>
      <button class="play" id="play" aria-label="Play"><svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></button>
      <button class="icon" id="next" aria-label="Next sentence"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 9 6-9 6zM18 6v12"/></svg></button>
    </div>
    <div class="opts">
      <div class="line">
        <label>Voice <select id="voice"></select></label>
        <label>Speed <select id="speed"><option>0.8</option><option>0.9</option><option selected>1</option><option>1.1</option><option>1.2</option><option>1.35</option><option>1.5</option></select></label>
        <label>I speak <select id="lang"><option value="en-US">English</option><option value="zh-CN">中文</option></select></label>
      </div>
      <div class="skip" role="group" aria-label="Skip when reading aloud">
        <span class="lbl">Skip</span>
        <button class="chip" data-skip="cites" title="(Smith et al., 2019), [12]">Citations</button>
        <button class="chip" data-skip="caption" title="Figure and table captions">Captions</button>
        <button class="chip" data-skip="table">Tables</button>
        <button class="chip" data-skip="code">Code</button>
        <button class="chip" data-skip="small" title="Footnotes, labels and other small text">Small print</button>
      </div>
    </div>
    <div class="call">
      <span id="callState" class="hidden"><span class="dot"></span><span id="callText"></span></span>
      <span class="keys" id="keys">Space play/pause</span>
      <label class="barge" title="Talk over the AI to interrupt it. Works best with headphones."><input type="checkbox" id="barge" checked> Interrupt by talking</label>
      <button class="talk" id="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span id="talkLabel">Call</span></button>
    </div>
  </div>
</div>
<div id="tools" role="toolbar"></div>
<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script>
// Phones get the simplified page (add ?desktop=1 to the address to stay on the full version)
if (matchMedia('(max-width: 700px)').matches && !location.search.includes('desktop')) location.replace('/m');
const $ = s => document.querySelector(s);
const pref = { get:(k,d)=>{ try{ return localStorage.getItem('ra.'+k) ?? d; }catch(e){ return d; } }, set:(k,v)=>{ try{ localStorage.setItem('ra.'+k, v); }catch(e){} } };
const S = { id:null, title:'', sents:[], pos:0, hls:[], chat:[], mode:'idle', anchor:null, sel:null, geo:null, view:'text' };
// geo = where every word sits on the original PDF pages: words[k] = [sentence, charStart, charEnd, page, x0, y0, x1, y1]
let G = null;  // lookup tables built from S.geo
// hls = highlights: {id, s1, o1, s2, o2, c (color 1-4), note, text}  (s = sentence index, o = character offset)
// mode: idle | reading | listening | thinking | speaking
let token = 0, aiAbort = null, saveTimer = null, lastUserScroll = 0, micDenied = false, config = {};
const player = new Audio();

/* ---------------- server ---------------- */
async function api(path, opts){ const r = await fetch(path, opts); if (!r.ok){ let m = r.statusText; try{ m = (await r.json()).detail || m; }catch(e){} throw new Error(m); } return r; }
function saveSoon(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 600); }
function saveNow(){
  if (!S.id) return Promise.resolve();
  const body = JSON.stringify({pos:S.pos, hls:S.hls, chat:S.chat});
  return fetch('/api/state/' + S.id, {method:'POST', headers:{'Content-Type':'application/json'}, body, keepalive: body.length < 60000}).catch(()=>{});
}

async function init(){
  try{ config = await (await api('/api/config')).json(); }catch(e){ config = {}; }
  const sel = $('#voice'), want = pref.get('voice', config.voice || 'af_heart');
  sel.innerHTML = (config.voices || []).map(v => `<option ${v===want?'selected':''}>${v}</option>`).join('');
  $('#speed').value = pref.get('speed', '1'); $('#lang').value = pref.get('lang', 'en-US'); $('#barge').checked = pref.get('barge', '1') === '1';
  const w = [];
  if (!config.tts_ok) w.push('The voice model isn’t installed. In the project folder run <b>python download_models.py</b>, then restart the server.');
  if (!config.ai_ok) w.push('No API key found. Put your key in the <b>.env</b> file (see README), then restart the server. Reading still works without it.');
  if (!SR) w.push('This browser can’t listen to your voice. Use Chrome or Edge for calls. You can still type questions.');
  $('#warnings').innerHTML = w.map(x => `<div class="warn">${x}</div>`).join('');
  showLibrary();
}
async function showLibrary(){
  document.body.classList.add('home');
  stopEverything(); S.id = null; S.geo = null; S.view = 'text';
  S.sents = []; S.hls = []; S.chat = []; editingId = null;
  $('#msgs').innerHTML = ''; $('#noteList').innerHTML = ''; $('#live').textContent = ''; $('#convTitle').textContent = '';
  $('#pages').innerHTML = ''; $('#pages').classList.add('hidden'); $('#text').classList.remove('hidden'); $('#margin').innerHTML = '';
  $('#viewBtn').classList.add('hidden'); $('#exportBtn').classList.add('hidden');
  $('#empty').classList.remove('hidden'); $('#text').innerHTML = ''; $('#home').classList.add('hidden');
  $('#title').textContent = 'PaperTalkthrough'; $('#where').textContent = '';
  try{
    const items = await (await api('/api/library')).json();
    $('#recent').classList.toggle('hidden', !items.length);
    $('#recentList').innerHTML = '';
    items.forEach(d => {
      const row = document.createElement('div'); row.className = 'item';
      const b = document.createElement('button'); b.className = 'open';
      b.innerHTML = `<span></span><span>${Math.round(d.pos / Math.max(1,d.total) * 100)}% read</span>`;
      b.firstChild.textContent = d.title; b.onclick = () => openDoc(d.id);
      const del = document.createElement('button'); del.className = 'del'; del.textContent = 'Remove';
      del.onclick = async () => {
        if (!confirm(`Remove "${d.title}" from your library? Its highlights, notes and conversation will be deleted too.`)) return;
        try{ await api('/api/doc/' + d.id, {method:'DELETE'}); }catch(e){ $('#status').textContent = 'Couldn’t remove it: ' + e.message; }
        showLibrary();
      };
      row.append(b, del); $('#recentList').appendChild(row);
    });
  }catch(e){}
}
async function upload(file){

        if (d.action){ aiMark(d.action); continue; }
        if (d.status){ (entry.acts ||= []).push(d.status); const st = document.createElement('div'); st.className = 'status'; st.textContent = d.status; bubble.parentElement.insertBefore(st, bubble); continue; }
        full += d.t; aiSaying = full; bubble.textContent = full; entry.text = full; scrollChat(); take(false);
      }
    }
    take(true);
  }catch(e){
    if (e.name === 'AbortError'){ if (!full){ S.chat.splice(S.chat.indexOf(entry), 1); bubble.parentElement.remove(); } return; }
    full = full || 'I couldn’t reach the AI. Check that the server is running and your key is set.';
    bubble.textContent = full; entry.text = full;
  }
  done = true; saveSoon();
  if (my === token) pump();
}

/* ---------------- page view (the original PDF pages) ---------------- */
function setView(v){

  S.view = v; pref.set('view', v); deselect();

  $('#viewBtn').textContent = v === 'page' ? 'Text view' : 'Page view';
  if (v === 'page' && !$('#pages').children.length) buildPages();

}
function buildPages(){
  const box = $('#pages'); box.innerHTML = '';
  S.geo.pages.forEach(([w, h], k) => {
    const wrap = document.createElement('div'); wrap.className = 'pgwrap'; wrap.dataset.pg = k + 1; wrap.style.aspectRatio = w + ' / ' + h;
    const img = document.createElement('img'); img.loading = 'lazy'; img.draggable = false; img.alt = 'Page ' + (k + 1); img.src = `/api/page/${S.id}/${k + 1}`;
    const ov = document.createElement('div'); ov.className = 'ov';
    wrap.append(img, ov); box.appendChild(wrap);
  });
}
const ovOf = pg => document.querySelector(`.pgwrap[data-pg="${pg}"] .ov`);
function wordsOfSent(i){ const r = G?.bySent[i]; const a = []; if (r) for (let k = r[0]; k < r[1]; k++) a.push(k); return a; }
function wordsOfHl(h){
  const a = [], W = S.geo.words;
  for (let i = h.s1; i <= h.s2; i++) for (const k of wordsOfSent(i)){
    const w = W[k];
    if (i === h.s1 && w[2] <= h.o1) continue;
    if (i === h.s2 && w[1] >= h.o2) continue;
    a.push(k);
  }
  return a;
}
function lineBoxes(ks){
  const out = [];
  for (const k of ks){
    const w = S.geo.words[k], last = out[out.length - 1];
    if (last && last.pg === w[3] && Math.abs(last.y0 - w[5]) < 2 && w[4] - last.x1 < 20 && w[4] >= last.x0){
      last.x1 = Math.max(last.x1, w[6]); last.y0 = Math.min(last.y0, w[5]); last.y1 = Math.max(last.y1, w[7]);
    } else out.push({pg:w[3], x0:w[4], y0:w[5], x1:w[6], y1:w[7]});
  }
  return out;
}
function place(b, cls){
  const ov = ovOf(b.pg); if (!ov) return null;
  const [pw, ph] = S.geo.pages[b.pg - 1], pad = 1.2;
  const d = document.createElement('div'); d.className = 'box ' + cls;
  d.style.left = ((b.x0 - pad) / pw * 100) + '%'; d.style.top = ((b.y0 - pad) / ph * 100) + '%';
  d.style.width = ((b.x1 - b.x0 + 2*pad) / pw * 100) + '%'; d.style.height = ((b.y1 - b.y0 + 2*pad) / ph * 100) + '%';
  ov.appendChild(d); return d;
}
function drawNow(i){
  document.querySelectorAll('.box.now').forEach(x => x.remove());
  let first = null;
  lineBoxes(wordsOfSent(i)).forEach(b => { const d = place(b, 'now'); first ||= d; });
  return first;
}
function drawHls(){
  if (S.view !== 'page') return;
  document.querySelectorAll('.box.hlb').forEach(x => x.remove());
  for (const h of S.hls) lineBoxes(wordsOfHl(h)).forEach(b => { const d = place(b, 'hlb c' + h.c + (h.note ? ' noted' : '')); if (d) d.dataset.h = h.id; });
}
// Which word is under the pointer (or close to it)
function wordAt(x, y){
  const wrap = document.elementFromPoint(x, y)?.closest('.pgwrap'); if (!wrap) return -1;
  const pg = +wrap.dataset.pg, r = wrap.getBoundingClientRect(), [pw, ph] = S.geo.pages[pg - 1];
  const px = (x - r.left) / r.width * pw, py = (y - r.top) / r.height * ph;
  let best = -1, bd = 1e9;
  for (const k of (G.byPage[pg] || [])){
    const w = S.geo.words[k];
    const dx = px < w[4] ? w[4] - px : px > w[6] ? px - w[6] : 0, dy = py < w[5] ? w[5] - py : py > w[7] ? py - w[7] : 0;
    const d = dx + dy * 3; if (d < bd){ bd = d; best = k; }
  }
  return bd < 14 ? best : -1;
}
let drag = null;
$('#pages').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  drag = {start: wordAt(e.clientX, e.clientY), end: -1, x: e.clientX, y: e.clientY, moved: false, dismiss: menuOpen};
});
document.addEventListener('mousemove', e => {
  if (!drag) return;
  if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 6) drag.moved = true;
  if (!drag.moved || drag.start < 0) return;
  const k = wordAt(e.clientX, e.clientY); if (k < 0 || k === drag.end) return;
  drag.end = k;
  document.querySelectorAll('.box.selb').forEach(x => x.remove());
  const a = Math.min(drag.start, k), b = Math.max(drag.start, k), ks = []; for (let j = a; j <= b; j++) ks.push(j);
  lineBoxes(ks).forEach(bx => place(bx, 'selb'));
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  const rect = {left: e.clientX, right: e.clientX, top: e.clientY - 10, bottom: e.clientY + 10};
  if (d.moved && d.start >= 0 && d.end >= 0){
    const W = S.geo.words, a = W[Math.min(d.start, d.end)], b = W[Math.max(d.start, d.end)];
    const sel = {s1:a[0], o1:a[1], s2:b[0], o2:b[2], rect};
    sel.text = hlText(sel.s1, sel.o1, sel.s2, sel.o2);
    pendingSel = null; selectionMenu(sel); return;
  }
  document.querySelectorAll('.box.selb').forEach(x => x.remove());
  if (d.moved) return;
  if (d.dismiss){ deselect(); return; }
  if (d.start < 0) return;
  const w = S.geo.words[d.start];
  const h = [...S.hls].reverse().find(h => (w[0] > h.s1 || (w[0] === h.s1 && w[2] > h.o1)) && (w[0] < h.s2 || (w[0] === h.s2 && w[1] < h.o2)));
  if (h){ deselect(); highlightMenu(h, rect); return; }
  if (S.mode === 'reading'){ deselect(); S.pos = w[0]; startReading(); } else select(w[0]);
});
function hlText(s1, o1, s2, o2, max = 300){
  const parts = []; for (let i = s1; i <= s2; i++) parts.push(S.sents[i].t.slice(i === s1 ? o1 : 0, i === s2 ? o2 : undefined));
  return parts.join(' ').slice(0, max);
}

/* ---------------- highlights and notes ---------------- */
const newId = () => 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const byPos = (a, b) => a.s1 - b.s1 || a.o1 - b.o1;
const COLORS = {1:'var(--h1)', 2:'var(--h2)', 3:'var(--h3)', 4:'var(--h4)'};
let editingId = null, menuOpen = false, pendingSel = null;

// Draw the highlight <mark>s inside one sentence
function paint(i){
  const e = el(i); if (!e) return;
  const t = S.sents[i].t;
  const cover = S.hls.filter(h => h.s1 <= i && i <= h.s2)
    .map(h => ({h, a: i === h.s1 ? h.o1 : 0, b: i === h.s2 ? h.o2 : t.length})).filter(x => x.b > x.a);
  if (!cover.length){ if (e.dataset.painted){ e.textContent = t; delete e.dataset.painted; } return; }
  const cuts = [...new Set([0, t.length, ...cover.flatMap(x => [x.a, x.b])])].sort((a, b) => a - b);
  e.textContent = ''; e.dataset.painted = '1';
  for (let k = 0; k < cuts.length - 1; k++){
    const a = cuts[k], b = cuts[k+1], piece = t.slice(a, b);
    const top = cover.filter(x => x.a <= a && x.b >= b).pop();
    if (top){ const m = document.createElement('mark'); m.className = 'hl c' + top.h.c + (top.h.note ? ' noted' : ''); m.dataset.h = top.h.id; m.textContent = piece; e.appendChild(m); }
    else e.appendChild(document.createTextNode(piece));
  }
}
function paintRange(a, b){ for (let i = a; i <= b; i++) paint(i); }
function paintAll(){
  const touched = new Set([...document.querySelectorAll('.s[data-painted]')].map(e => +e.dataset.i));
  S.hls.forEach(h => { for (let i = h.s1; i <= h.s2; i++) touched.add(i); });
  touched.forEach(paint); drawHls(); renderNotes();
}
function refresh(h){ if (h) paintRange(h.s1, h.s2); drawHls(); saveSoon(); layoutNotes(); renderNotes(); }

// Turn the browser's text selection into sentence + character positions
function offsetIn(sEl, node, off){ const r = document.createRange(); r.setStart(sEl, 0); r.setEnd(node, off); return r.toString().length; }
function readSelection(){
  const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return null;
  const r = sel.getRangeAt(0); if (!$('#text').contains(r.commonAncestorContainer)) return null;
  let s1 = -1, s2 = -1;
  for (const e of document.querySelectorAll('#text .s')){
    if (r.intersectsNode(e)){ const i = +e.dataset.i; if (s1 < 0) s1 = i; s2 = i; } else if (s1 >= 0) break;
  }
  if (s1 < 0) return null;
  const e1 = el(s1), e2 = el(s2);
  let o1 = e1.contains(r.startContainer) ? offsetIn(e1, r.startContainer, r.startOffset) : 0;
  let o2 = e2.contains(r.endContainer) ? offsetIn(e2, r.endContainer, r.endOffset) : S.sents[s2].t.length;
  if (o2 === 0 && s2 > s1){ s2--; o2 = S.sents[s2].t.length; }
  if (o1 >= S.sents[s1].t.length && s1 < s2){ s1++; o1 = 0; }
  // snap to whole words, and don't start or end on a space
  while (o1 > 0 && /[\w'’-]/.test(S.sents[s1].t[o1-1]) && /[\w'’-]/.test(S.sents[s1].t[o1] || '')) o1--;
  while (o2 < S.sents[s2].t.length && /[\w'’-]/.test(S.sents[s2].t[o2]) && /[\w'’-]/.test(S.sents[s2].t[o2-1] || '')) o2++;
  while (o1 < S.sents[s1].t.length && /\s/.test(S.sents[s1].t[o1])) o1++;
  while (o2 > 0 && /\s/.test(S.sents[s2].t[o2-1])) o2--;
  if (s1 === s2 && o2 <= o1) return null;
  return {s1, o1, s2, o2, text: hlText(s1, o1, s2, o2), rect: r.getBoundingClientRect()};
}

const swatches = cur => [1,2,3,4].map(c => `<button class="sw${cur == c ? ' on' : ''}" data-act="color" data-c="${c}" style="background:${COLORS[c]}" aria-label="Highlight color ${c}"></button>`).join('');

// 1) Dragged across text: highlight it

// The AI highlighted something or wrote a note for you during a call
function aiMark(a){
  let h = S.hls.find(x => x.s1 === a.s1 && x.o1 === a.o1 && x.s2 === a.s2 && x.o2 === a.o2);
  if (h){ if (a.note) h.note = h.note ? h.note + '\n' + a.note : a.note; if (!a.note) h.c = a.c; }
  else { h = {id:newId(), s1:a.s1, o1:a.o1, s2:a.s2, o2:a.o2, c:a.c, note:a.note || '', text:a.text}; S.hls.push(h); S.hls.sort(byPos); }

function readFrom(i){ if (S.anchor != null){ stopRec(); aiAbort?.abort(); S.anchor = null; } S.pos = i; startReading(); }

// Notes: in the margin beside the text when there's room, otherwise in the Notes tab
const marginShown = () => getComputedStyle($('#margin')).display !== 'none';
const anchorOf = id => document.querySelector(S.view === 'page' ? `.box.hlb[data-h="${id}"]` : `mark.hl[data-h="${id}"]`);

function flash(id){
  const ms = document.querySelectorAll(`mark.hl[data-h="${id}"], .box.hlb[data-h="${id}"]`); const a = anchorOf(id); if (!a) return;
  a.scrollIntoView({block:'center', behavior:'smooth'});

function noteBody(h, box){
  // Shared by margin cards and the Notes tab

    box.dataset.edit = h.id;
    const ta = document.createElement('textarea'); ta.value = h.note || ''; ta.placeholder = 'Your note…';
    const row = document.createElement('div'); row.className = 'row';

    const saveNote = () => { h.note = ta.value.trim(); editingId = null; refresh(h); };
    btn('Save', saveNote);
    btn('Cancel', () => { editingId = null; layoutNotes(); renderNotes(); });
    if (h.note) btn('Delete note', () => { h.note = ''; editingId = null; refresh(h); });
    ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) saveNote(); if (e.key === 'Escape'){ editingId = null; layoutNotes(); renderNotes(); } });

function layoutNotes(){
  const M = $('#margin'); M.innerHTML = '';

  let bottom = -Infinity;
  for (const h of S.hls.filter(x => x.note || x.id === editingId).sort(byPos)){
    const m = anchorOf(h.id); if (!m) continue;

    card.onmouseenter = () => document.querySelectorAll(`[data-h="${h.id}"]`).forEach(x => x.classList.add('flash'));
    card.onmouseleave = () => document.querySelectorAll(`[data-h="${h.id}"]`).forEach(x => x.classList.remove('flash'));
    M.appendChild(card);
    const top = Math.max(m.getBoundingClientRect().top - base, bottom + 8);

function renderNotes(){

    const q = document.createElement('q'); q.textContent = 'p.' + S.sents[h.s1].p + '  ' + (h.text.length > 160 ? h.text.slice(0,160) + '…' : h.text);

      btn(h.note ? 'Edit note' : 'Add note', () => openEditor(h.id));

    }

}

/* ---------------- wiring ---------------- */
$('#pick').onclick = () => $('#file').click();
$('#home').onclick = () => { saveNow(); showLibrary(); };
$('#clearChat').onclick = () => {
  if (!S.id || !S.chat.length) return;
  if (!confirm('Clear the whole conversation for this document? Your highlights and notes stay.')) return;
  if (['listening','thinking','speaking'].includes(S.mode)) endCall(false);
  S.chat = []; renderChat(); saveNow();
};
$('#viewBtn').onclick = () => setView(S.view === 'page' ? 'text' : 'page');
$('#exportBtn').onclick = async () => {
  if (!S.geo){ alert('Export needs the original PDF. Open this PDF again with "Open a PDF" (your notes are kept).'); return; }
  clearTimeout(saveTimer); await saveNow();
  const a = document.createElement('a'); a.href = '/api/export/' + S.id; a.download = ''; document.body.appendChild(a); a.click(); a.remove();
};
$('#file').onchange = e => { const f = e.target.files[0]; if (f) upload(f); e.target.value = ''; };
const drop = $('#drop');
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('over')));
drop.addEventListener('drop', e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) upload(f); });
// A click jumps / opens a menu. A drag selects text for highlighting and never jumps.
let dismissing = false;
$('#text').addEventListener('mousedown', () => { dismissing = menuOpen; });
$('#text').addEventListener('mouseup', () => setTimeout(() => { const sel = readSelection(); if (sel) selectionMenu(sel); }, 0));
$('#text').addEventListener('click', e => {
  if (!getSelection().isCollapsed) return;                  // that was a drag-select
  if (dismissing){ dismissing = false; deselect(); return; } // first click just closes an open menu
  const m = e.target.closest('mark.hl');
  if (m){ const h = S.hls.find(x => x.id === m.dataset.h); if (h){ deselect(); highlightMenu(h, m.getBoundingClientRect()); return; } }
  const s = e.target.closest('.s'); if (!s) return;
  const i = +s.dataset.i;
  if (S.mode === 'reading'){ deselect(); S.pos = i; startReading(); } else select(i);
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#tools') && !e.target.closest('#text')) deselect(); });
addEventListener('resize', () => { layoutNotes(); });
$('#pages').addEventListener('load', () => { clearTimeout(window.__lt); window.__lt = setTimeout(layoutNotes, 150); }, true);
document.fonts?.ready.then(layoutNotes);
['wheel','touchmove'].forEach(ev => $('#reader').addEventListener(ev, () => { if (menuOpen && !pendingSel) deselect(); }, {passive:true}));
['wheel','touchmove','keydown'].forEach(ev => $('#reader').addEventListener(ev, () => lastUserScroll = Date.now(), {passive:true}));
$('#play').onclick = () => S.mode === 'reading' ? pauseReading() : (S.anchor != null ? endCall(true) : startReading());
const step = d => { if (!S.sents.length) return; S.pos = Math.max(0, Math.min(S.sents.length - 1, S.pos + d)); S.mode === 'reading' ? startReading() : (highlight(S.pos, true), saveSoon()); };
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#talk').onclick = () => ['listening','thinking','speaking'].includes(S.mode) ? endCall(true) : startCall();
$('#send').onclick = () => { const t = $('#input').value.trim(); if (!t || !S.sents.length) return; if (S.anchor == null){ stopAudio(); S.anchor = S.pos; } userSaid(t); };
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); $('#send').click(); } });
$('#input').addEventListener('focus', () => { if (S.mode === 'reading'){ stopAudio(); S.anchor = S.pos; setMode('listening'); stopRec(); } });
['voice','speed','lang'].forEach(id => $('#' + id).onchange = () => { pref.set(id, $('#' + id).value); if (S.mode === 'reading') startReading(); if (id === 'lang' && rec){ const m = S.mode; stopRec(); if (m === 'listening') listen(); else ensureRec(); } });
// What to leave out when reading aloud (any combination, or nothing)
const skipSet = new Set((() => { try{ return JSON.parse(pref.get('skipset', '["caption","table","code","small"]')); }catch(e){ return []; } })());
document.querySelectorAll('.chip[data-skip]').forEach(b => {
  b.setAttribute('aria-pressed', skipSet.has(b.dataset.skip));
  b.onclick = () => {
    skipSet.has(b.dataset.skip) ? skipSet.delete(b.dataset.skip) : skipSet.add(b.dataset.skip);
    b.setAttribute('aria-pressed', skipSet.has(b.dataset.skip)); pref.set('skipset', JSON.stringify([...skipSet]));
  };
});
// Captions, tables, code and small print are shown in grey and (by default) not read aloud
const readable = i => S.sents[i] && !(S.sents[i].k && skipSet.has(S.sents[i].k));
function nextReadable(i, n){ const out = []; for (let j = i + 1; j < S.sents.length && out.length < n; j++) if (readable(j)) out.push(j); return out; }

$('#barge').onchange = () => pref.set('barge', $('#barge').checked ? '1' : '0');
document.querySelectorAll('.tabs [data-tab]').forEach(b => b.onclick = () => openTab(b.dataset.tab));
document.addEventListener('keydown', e => {
  if (e.target.closest('textarea,input,select') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.code === 'Space'){ e.preventDefault();
    if (S.mode === 'speaking' || S.mode === 'thinking') interruptAI();
    else if (S.mode === 'reading') pauseReading();
    else if (S.mode === 'idle') startReading(); }
  if (e.key === 'Escape') deselect();
});
addEventListener('pagehide', saveNow);
init();
</script>
</body>
</html>
